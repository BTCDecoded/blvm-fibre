[package]
name = "blvm-fibre-fuzz"
version = "0.0.0"
authors = ["Bitcoin Commons Team"]
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
blvm-fibre = { path = ".." }
libfuzzer-sys = "0.4"

[patch.crates-io]
blvm-node = { git = "https://github.com/BTCDecoded/blvm-node", branch = "main" }
blvm-sdk = { git = "https://github.com/BTCDecoded/blvm-sdk", branch = "main" }
blvm-sdk-macros = { git = "https://github.com/BTCDecoded/blvm-sdk", branch = "main", subdirectory = "crates/blvm-sdk-macros" }

[profile.release]
opt-level = 3

[[bin]]
name = "fibre_chunk_deserialize"
path = "fuzz_targets/fibre_chunk_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fibre_chunk_roundtrip"
path = "fuzz_targets/fibre_chunk_roundtrip.rs"
test = false
doc = false
bench = false
