[package]
name = "blvm-fibre-fuzz"
version = "0.0.0"
authors = ["Bitcoin Commons Team"]
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
blvm-fibre = { path = ".." }
libfuzzer-sys = "0.4"

[patch.crates-io]
blvm-primitives = { path = "../../blvm-primitives" }
blvm-protocol = { path = "../../blvm-protocol" }
blvm-consensus = { path = "../../blvm-consensus" }
blvm-secp256k1 = { path = "../../blvm-secp256k1" }
blvm-spec-lock = { path = "../../blvm-spec-lock" }
blvm-muhash = { path = "../../blvm-muhash" }
blvm-node = { path = "../../blvm-node" }
blvm-sdk = { path = "../../blvm-sdk" }

[profile.release]
opt-level = 3

[[bin]]
name = "fibre_chunk_deserialize"
path = "fuzz_targets/fibre_chunk_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fibre_chunk_roundtrip"
path = "fuzz_targets/fibre_chunk_roundtrip.rs"
test = false
doc = false
bench = false
