name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "1"

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-key }}
    steps:
      - name: Disk check
        uses: BTCDecoded/rust-ci/runner-disk-guard@main

      - uses: actions/checkout@v4

      - id: cache
        name: Cache key
        run: |
          DEPS_KEY=$(sha256sum Cargo.toml | cut -d' ' -f1)
          TOOLCHAIN=$(grep -E '^channel|rust-version' rust-toolchain.toml Cargo.toml 2>/dev/null | head -1 | sha256sum | cut -d' ' -f1 || echo "stable")
          CACHE_KEY="${DEPS_KEY}-${TOOLCHAIN}"
          echo "cache-key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          CACHE_ROOT="/tmp/runner-cache"
          mkdir -p "$CACHE_ROOT/cargo/$CACHE_KEY"/{registry,git} "$CACHE_ROOT/target/$CACHE_KEY"

  quality:
    name: Quality (fmt, clippy, test)
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    steps:
      - uses: actions/checkout@v4

      - name: Job-local HOME (Linux; avoid rustc ETXTBSY on shared rustup installs)
        run: |
          mkdir -p "${RUNNER_TEMP}/blvm-fibre-ci-home"
          echo "HOME=${RUNNER_TEMP}/blvm-fibre-ci-home" >> "$GITHUB_ENV"

      - name: Cache bind env (Linux self-hosted)
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}-quality

      - name: Restore Cargo cache (Linux self-hosted)
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Repair Cargo registry (incomplete unicode-width)
        shell: bash
        run: |
          set -euo pipefail
          reg_src="${HOME}/.cargo/registry/src"
          reg_cache="${HOME}/.cargo/registry/cache"
          [ -d "$reg_src" ] || exit 0
          find "$reg_src" -path '*/unicode-width-*/src/lib.rs' 2>/dev/null | while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            src_dir=$(dirname "$lib")
            if [[ ! -f "$src_dir/tables.rs" ]]; then
              crate_root=$(dirname "$src_dir")
              echo "Removing incomplete unicode-width tree: $crate_root"
              rm -rf "$crate_root"
            fi
          done
          if [[ -d "$reg_cache" ]]; then
            find "$reg_cache" -name 'unicode-width-*.crate' -delete 2>/dev/null || true
          fi

      - name: Install Rust (Linux self-hosted)
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      # Self-hosted images may pin rustc without rustfmt/clippy components (e.g. 1.88.0 toolchain).
      - name: Add rustfmt and clippy for active toolchain
        shell: bash
        run: |
          set -euo pipefail
          REL=$(rustc -vV | awk '/^release:/{print $2}')
          HOST=$(rustc -vV | awk '/^host:/{print $2}')
          rustup component add rustfmt clippy --toolchain "${REL}-${HOST}"

      - name: Regenerate lockfile
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets

      - name: test
        run: cargo test --all-targets

      - name: Save Cargo cache (Linux self-hosted)
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

      - name: Prune old runner caches (Linux self-hosted)
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: [self-hosted, Linux, X64, builds]
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runs_on: [self-hosted, Linux, X64, builds]
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runs_on: windows-2022
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Job-local HOME (Linux; avoid rustc ETXTBSY on shared rustup installs)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${RUNNER_TEMP}/blvm-fibre-ci-home"
          echo "HOME=${RUNNER_TEMP}/blvm-fibre-ci-home" >> "$GITHUB_ENV"

      - name: Cache bind env (Linux self-hosted)
        if: runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}-${{ matrix.target }}

      - name: Restore Cargo cache (Linux self-hosted)
        if: runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Repair Cargo registry (incomplete unicode-width)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          reg_src="${HOME}/.cargo/registry/src"
          reg_cache="${HOME}/.cargo/registry/cache"
          [ -d "$reg_src" ] || exit 0
          find "$reg_src" -path '*/unicode-width-*/src/lib.rs' 2>/dev/null | while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            src_dir=$(dirname "$lib")
            if [[ ! -f "$src_dir/tables.rs" ]]; then
              crate_root=$(dirname "$src_dir")
              echo "Removing incomplete unicode-width tree: $crate_root"
              rm -rf "$crate_root"
            fi
          done
          if [[ -d "$reg_cache" ]]; then
            find "$reg_cache" -name 'unicode-width-*.crate' -delete 2>/dev/null || true
          fi

      - name: Install Rust (Linux self-hosted)
        if: runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Add Rust target (pinned toolchain)
        if: runner.os == 'Linux'
        run: rustup target add ${{ matrix.target }}

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Regenerate lockfile
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Install cross (aarch64 Linux)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }}

      - name: Save Cargo cache (Linux self-hosted)
        if: always() && runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

      - name: Prune old runner caches (Linux self-hosted)
        if: always() && runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune
