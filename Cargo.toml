[package]
name = "blvm-fibre"
version = "0.1.3"
edition = "2021"
rust-version = "1.82"
authors = ["Bitcoin Commons Team"]
description = "FIBRE (Fast Internet Bitcoin Relay Engine) loadable module for blvm-node"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-fibre"
homepage = "https://btcdecoded.org"
keywords = ["bitcoin", "fibre", "module"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "blvm-fibre"
path = "src/main.rs"

[lib]
name = "blvm_fibre"
path = "src/lib.rs"

[dependencies]
# Monorepo: path deps keep one `blvm-node` / `blvm-sdk` in the graph with sibling crates (see blvm-bench).
blvm-node = { path = "../blvm-node", default-features = false }
blvm-sdk = { path = "../blvm-sdk", default-features = false, features = ["node"] }
blvm-sdk-macros = { path = "../blvm-sdk/crates/blvm-sdk-macros" }
blvm-protocol = { path = "../blvm-protocol" }
crc32fast = "=1.3"
# Native TLS via blvm-node pulls openssl-sys; `vendored` avoids missing target OpenSSL (e.g. aarch64 cross).
openssl = { version = "0.10", features = ["vendored"] }

tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "=0.8.2"
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reed-solomon-erasure = "=6.0.0"
sha2 = "=0.10.9"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
