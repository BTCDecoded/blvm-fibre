[package]
name = "blvm-fibre"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
authors = ["Bitcoin Commons Team"]
description = "FIBRE (Fast Internet Bitcoin Relay Engine) loadable module for blvm-node"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-fibre"
homepage = "https://btcdecoded.org"
keywords = ["bitcoin", "fibre", "module"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "blvm-fibre"
path = "src/main.rs"

[lib]
name = "blvm_fibre"
path = "src/lib.rs"

[dependencies]
# blvm-node: default-features false + `node` feature from blvm-sdk supplies the usual module stack without rocksdb.
blvm-node = { version = ">=0.1, <1", default-features = false }
blvm-sdk = { version = ">=0.1, <1", default-features = false, features = ["node"] }
blvm-sdk-macros = { version = ">=0.1, <1" }
blvm-protocol = { version = ">=0.1, <1" }
crc32fast = "=1.3"
# Native TLS via blvm-node pulls openssl-sys; `vendored` avoids missing target OpenSSL (e.g. aarch64 cross).
openssl = { version = "0.10", features = ["vendored"] }

tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "=0.8.2"
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reed-solomon-erasure = "=6.0.0"
sha2 = "=0.10.9"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }

# FIBRE hooks are on `main` before every crates.io semver bump. Patch integrates CI, Windows, and
# solo checkouts without sibling paths. For local monorepo path overrides, use `.cargo/config.toml`
# (see Cargo book: configuration inheritance).
[patch.crates-io]
blvm-node = { git = "https://github.com/BTCDecoded/blvm-node", branch = "main" }
blvm-sdk = { git = "https://github.com/BTCDecoded/blvm-sdk", branch = "main" }
# Keep proc-macros in lockstep with patched blvm-sdk + blvm-node (CompanionUdpPeer*, etc.).
blvm-sdk-macros = { git = "https://github.com/BTCDecoded/blvm-sdk", branch = "main", subdirectory = "crates/blvm-sdk-macros" }
